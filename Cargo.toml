rustyline = "12.0"
futures-util = "0.3"
colored = "3.1.1"
termimad = "0.35.3"
walkdir = "2.5.0"
inquire = "0.9.4"
indicatif = "0.18.6"
sysinfo = "0.39.6"
notify = "8.2.0"
base64 = "0.23.1"
