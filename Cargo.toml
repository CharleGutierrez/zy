[package]
name = "zy"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
syn = { version = "2.0", features = ["full", "visit", "fold", "clone-impls", "extra-traits", "parsing", "printing"] }
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustyline = "12.0"
futures-util = "0.3"
colored = "3.1.1"
termimad = "0.35.3"
walkdir = "2.5.0"
inquire = "0.9.4"
indicatif = "0.18.6"
sysinfo = "0.39.6"
notify = "8.2.0"
base64 = "0.23.1"
similar = "2.4.0"
ratatui = "0.26.3"
crossterm = "0.27.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
regex = "1.10"
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
rodio = "0.19.0"
rayon = "1.8"
memmap2 = "0.9"
